services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    ports:
      - "8080:8080"
    environment:
      LOCAL_AI_MODE: disabled
      LOCAL_PORT: "8080"
      AWS_EC2_METADATA_DISABLED: "true"
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-us.anthropic.claude-haiku-4-5-20251001-v1:0}
      MAX_DOWNLOAD_BYTES: "2000000"
      MAX_CLEAN_TEXT_CHARS: "120000"
      MAX_REDIRECTS: "5"
    volumes:
      - ./recipe_extractor:/app/recipe_extractor:ro
      - ./frontend:/app/frontend:ro
