[tool.poetry]
name = "recipe-extractor-aws"
version = "0.1.0"
description = "Serverless recipe extraction service using AWS SAM, Lambda, Step Functions, DynamoDB, S3, CloudFront, and Amazon Bedrock."
authors = ["Recipe Extractor Contributors"]
readme = "README.md"
packages = [{ include = "recipe_extractor" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
boto3 = ">=1.40,<2.0"
beautifulsoup4 = ">=4.13,<5.0"
urllib3 = ">=2.5,<3.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4,<9.0"
ruff = ">=0.12,<1.0"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
