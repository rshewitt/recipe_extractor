AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Production-oriented serverless recipe extractor with deterministic JSON-LD parsing and Bedrock fallback.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Bedrock model or inference-profile ID that supports Converse structured outputs.
  CacheTtlSeconds:
    Type: Number
    Default: 2592000
    MinValue: 3600
  ApiThrottleRate:
    Type: Number
    Default: 10
    MinValue: 1
  ApiThrottleBurst:
    Type: Number
    Default: 20
    MinValue: 1
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90, 120, 180, 365]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    MemorySize: 512
    Timeout: 15
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref RecipeTable
        TEMP_BUCKET: !Ref TemporaryContentBucket
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        CACHE_TTL_SECONDS: !Ref CacheTtlSeconds
        PROCESSING_TTL_SECONDS: '86400'
        PROCESSING_STALE_SECONDS: '900'
        MAX_DOWNLOAD_BYTES: '2000000'
        MAX_CLEAN_TEXT_CHARS: '120000'
        MAX_REDIRECTS: '5'
    Layers:
      - !Ref DependenciesLayer

Resources:
  RecipeApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      DefaultRouteSettings:
        ThrottlingBurstLimit: !Ref ApiThrottleBurst
        ThrottlingRateLimit: !Ref ApiThrottleRate

  DependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub '${AWS::StackName}-dependencies'
      Description: Python dependencies resolved by Poetry.
      ContentUri: .
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [x86_64]
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: makefile
      BuildArchitecture: x86_64

  RecipeTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: recipe_id
          AttributeType: S
      KeySchema:
        - AttributeName: recipe_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  TemporaryContentBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireTemporaryRecipeContent
            Status: Enabled
            ExpirationInDays: 1
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled

  SubmitFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: recipe_extractor.functions.submit.lambda_handler
      Timeout: 10
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref ExtractRecipeStateMachine
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RecipeTable
        - Statement:
            - Effect: Allow
              Action: states:StartExecution
              Resource: !Ref ExtractRecipeStateMachine
      Events:
        SubmitRecipe:
          Type: HttpApi
          Properties:
            ApiId: !Ref RecipeApi
            Path: /api/recipes
            Method: POST
    Metadata:
      BuildMethod: makefile

  GetRecipeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: recipe_extractor.functions.get_recipe.lambda_handler
      Timeout: 5
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RecipeTable
      Events:
        GetRecipe:
          Type: HttpApi
          Properties:
            ApiId: !Ref RecipeApi
            Path: /api/recipes/{recipe_id}
            Method: GET
    Metadata:
      BuildMethod: makefile

  FetchPageFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: recipe_extractor.functions.fetch_page.lambda_handler
      Timeout: 20
      MemorySize: 512
      Policies:
        - S3WritePolicy:
            BucketName: !Ref TemporaryContentBucket
    Metadata:
      BuildMethod: makefile

  ParsePageFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: recipe_extractor.functions.parse_page.lambda_handler
      Timeout: 20
      MemorySize: 1024
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref TemporaryContentBucket
        - S3WritePolicy:
            BucketName: !Ref TemporaryContentBucket
    Metadata:
      BuildMethod: makefile

  BedrockExtractFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: recipe_extractor.functions.bedrock_extract.lambda_handler
      Timeout: 90
      MemorySize: 1024
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref TemporaryContentBucket
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
    Metadata:
      BuildMethod: makefile

  SaveRecipeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: recipe_extractor.functions.save_recipe.lambda_handler
      Timeout: 10
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RecipeTable
        - S3CrudPolicy:
            BucketName: !Ref TemporaryContentBucket
    Metadata:
      BuildMethod: makefile

  MarkFailedFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: recipe_extractor.functions.mark_failed.lambda_handler
      Timeout: 10
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RecipeTable
        - S3CrudPolicy:
            BucketName: !Ref TemporaryContentBucket
    Metadata:
      BuildMethod: makefile


  SubmitFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${SubmitFunction}'
      RetentionInDays: !Ref LogRetentionDays

  GetRecipeFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${GetRecipeFunction}'
      RetentionInDays: !Ref LogRetentionDays

  FetchPageFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${FetchPageFunction}'
      RetentionInDays: !Ref LogRetentionDays

  ParsePageFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ParsePageFunction}'
      RetentionInDays: !Ref LogRetentionDays

  BedrockExtractFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${BedrockExtractFunction}'
      RetentionInDays: !Ref LogRetentionDays

  SaveRecipeFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${SaveRecipeFunction}'
      RetentionInDays: !Ref LogRetentionDays

  MarkFailedFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${MarkFailedFunction}'
      RetentionInDays: !Ref LogRetentionDays

  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/vendedlogs/states/${AWS::StackName}-extract-recipe'
      RetentionInDays: !Ref LogRetentionDays

  ExtractRecipeStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub '${AWS::StackName}-extract-recipe'
      Type: STANDARD
      Tracing:
        Enabled: true
      Logging:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogGroup.Arn
        IncludeExecutionData: false
        Level: ERROR
      DefinitionUri: statemachine/extract_recipe.asl.json
      DefinitionSubstitutions:
        FetchPageFunctionArn: !GetAtt FetchPageFunction.Arn
        ParsePageFunctionArn: !GetAtt ParsePageFunction.Arn
        BedrockExtractFunctionArn: !GetAtt BedrockExtractFunction.Arn
        SaveRecipeFunctionArn: !GetAtt SaveRecipeFunction.Arn
        MarkFailedFunctionArn: !GetAtt MarkFailedFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref FetchPageFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ParsePageFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref BedrockExtractFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref SaveRecipeFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref MarkFailedFunction
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogDelivery
                - logs:CreateLogStream
                - logs:GetLogDelivery
                - logs:UpdateLogDelivery
                - logs:DeleteLogDelivery
                - logs:ListLogDeliveries
                - logs:PutLogEvents
                - logs:PutResourcePolicy
                - logs:DescribeResourcePolicies
                - logs:DescribeLogGroups
              Resource: '*'

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-frontend-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  StaticCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-static-cache'
        DefaultTTL: 300
        MaxTTL: 86400
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-api-no-cache'
        DefaultTTL: 0
        MaxTTL: 0
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: all

  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub '${AWS::StackName}-api-origin-request'
        CookiesConfig:
          CookieBehavior: none
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - Accept
            - Content-Type
            - Origin
        QueryStringsConfig:
          QueryStringBehavior: all

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security-headers'
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: false
            Override: true
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; connect-src 'self'; img-src 'self' https: data:; script-src 'self'; style-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
            Override: true

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Origins:
          - Id: frontend-s3
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: recipe-api
            DomainName: !Sub '${RecipeApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: frontend-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: !Ref StaticCachePolicy
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: recipe-api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: !Ref ApiCachePolicy
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'

  WorkflowFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Recipe extraction workflow executions are failing.
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref ExtractRecipeStateMachine
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  SiteUrl:
    Description: CloudFront URL for the recipe extractor.
    Value: !Sub 'https://${FrontendDistribution.DomainName}'
  FrontendBucketName:
    Value: !Ref FrontendBucket
  DistributionId:
    Value: !Ref FrontendDistribution
  ApiEndpoint:
    Description: Direct API endpoint. Normal browser traffic should use the CloudFront SiteUrl.
    Value: !Sub 'https://${RecipeApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  RecipeTableName:
    Value: !Ref RecipeTable
