name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Poetry
        run: python -m pip install 'poetry>=2,<3'
      - name: Resolve lock on first run
        run: test -f poetry.lock || poetry lock
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Lint
        run: poetry run ruff check recipe_extractor tests
      - name: Test
        run: poetry run pytest
